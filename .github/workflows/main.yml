name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      load_medical_model:
        description: Build and push Medical AI service images to Docker Hub
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build frontend smoke test
        working-directory: ./frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

  build:
    name: Build and Push App Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          dockerfile: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/collab-meeting-app-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/collab-meeting-app-frontend:${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          dockerfile: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/collab-meeting-app-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/collab-meeting-app-backend:${{ github.sha }}

  medical-model-dockerhub:
    name: Build and Push Medical AI Images
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.load_medical_model == 'true')
      )
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: ocr
            path: OCR
          - name: detection
            path: DETECTION
          - name: gateway
            path: GATEWAY
          - name: ingestion
            path: INGESTION
          - name: scoring
            path: SCORING
          - name: explainability
            path: EXPLAINABILITY

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy shared package into service context
        shell: bash
        run: |
          mkdir -p "web-app/MEDICAL AI SYSTEM/${{ matrix.service.path }}/shared"
          cp -R "web-app/MEDICAL AI SYSTEM/shared/." "web-app/MEDICAL AI SYSTEM/${{ matrix.service.path }}/shared/"

      - name: Build and push ${{ matrix.service.name }} image
        uses: docker/build-push-action@v5
        with:
          context: ./web-app/MEDICAL AI SYSTEM/${{ matrix.service.path }}
          dockerfile: ./web-app/MEDICAL AI SYSTEM/${{ matrix.service.path }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/medical-${{ matrix.service.name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/medical-${{ matrix.service.name }}:${{ github.sha }}

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs:
      - build
      - medical-model-dockerhub
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy main app containers
        run: |
          ssh ${{ secrets.SERVER_BOT }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            # ── Login to Docker Hub (app account) ──
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # ── Pull new app images ──
            docker pull ${{ secrets.DOCKER_USERNAME }}/collab-meeting-app-frontend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/collab-meeting-app-backend:latest

            # ── Recreate app containers ──
            docker stop collab-frontend 2>/dev/null || true
            docker rm collab-frontend 2>/dev/null || true
            docker run -d \
              --name collab-frontend \
              --restart unless-stopped \
              -p 9090:9090 \
              --network collab-net \
              ${{ secrets.DOCKER_USERNAME }}/collab-meeting-app-frontend:latest

            docker stop collab-backend 2>/dev/null || true
            docker rm collab-backend 2>/dev/null || true
            docker run -d \
              --name collab-backend \
              --restart unless-stopped \
              -p 5000:5000 \
              --network collab-net \
              -e DB_HOST=db \
              -e DB_PORT=3306 \
              -e DB_NAME=collab_db \
              -e DB_USER=collab_user \
              -e DB_PASSWORD=collab_pass \
              -e JWT_SECRET=your_jwt_secret_here \
              -e ALLOWED_ORIGINS=http://localhost:9090 \
              ${{ secrets.DOCKER_USERNAME }}/collab-meeting-app-backend:latest

            # ── Remove old images to free space ──
            docker image prune -f
          EOF

      - name: Deploy Medical AI services
        run: |
          ssh ${{ secrets.SERVER_BOT }}@${{ secrets.SERVER_IP }} "cd ~/collab-meeting-app && echo 'DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}' > .env && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d && docker compose -f docker-compose.prod.yml ps"
