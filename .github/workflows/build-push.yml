name: Build and Push Medical AI Images

on:
  push:
    branches:
      - main

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push OCR image
        uses: docker/build-push-action@v5
        with:
          context: ./web-app/MEDICAL AI SYSTEM/OCR
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/medical-ocr:latest

      - name: Build and push detection image
        uses: docker/build-push-action@v5
        with:
          context: ./web-app/MEDICAL AI SYSTEM/DETECTION
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/medical-detection:latest

      - name: Build and push gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./web-app/MEDICAL AI SYSTEM/GATEWAY
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/medical-gateway:latest

      - name: Build and push ingestion image
        uses: docker/build-push-action@v5
        with:
          context: ./web-app/MEDICAL AI SYSTEM/INGESTION
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/medical-ingestion:latest

      - name: Build and push scoring image
        uses: docker/build-push-action@v5
        with:
          context: ./web-app/MEDICAL AI SYSTEM/SCORING
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/medical-scoring:latest

      - name: Build and push explainability image
        uses: docker/build-push-action@v5
        with:
          context: ./web-app/MEDICAL AI SYSTEM/EXPLAINABILITY
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/medical-explainability:latest
